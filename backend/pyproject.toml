[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-frontend-backend"
version = "1.3.1"
description = "Self-hosted web backend for OPNsense network access control and Elasticsearch 9.4.3 analytics"
readme = {text = "Self-hosted web backend for OPNsense network access control and Elasticsearch 9.4.3 analytics", content-type = "text/plain"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pydantic>=2.14.4,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    "sqlalchemy[asyncio]>=2.1.9,<3.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "alembic>=1.20.1,<2.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "elasticsearch[async]>=9.5.1,<10.0.0",
    "apscheduler>=3.11.3,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=0.26.0,<2.0.0",
    "pytest-cov>=6.3.0,<8.0.0",
    "respx>=0.23.1,<1.0.0",
    "freezegun>=1.5.5,<2.0.0",
    "ruff>=0.17.5,<1.0.0",
    "mypy>=2.4.1,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
core = "sysmon"
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S108"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
