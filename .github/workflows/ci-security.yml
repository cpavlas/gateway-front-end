name: CI & Security Audit Pipeline

on:
  push:
    branches: ["main", "phase*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  backend-quality-and-security:
    name: Backend Lint (Ruff SAST), Mypy, Pytest & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies & security tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Run Ruff Lint & Flake8-Bandit Security Rules (S)
        run: ruff check backend

      - name: Run Mypy Static Type Checker
        run: mypy backend/app

      - name: Run Pytest Unit, Integration & Route Auth-Bypass Security Suite
        run: pytest backend/tests --cov=app --cov-fail-under=84

      - name: Run Python Dependency Vulnerability Audit (pip-audit)
        working-directory: backend
        run: pip-audit

  frontend-quality-and-security:
    name: Frontend Vitest, TypeScript Build & NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests & Coverage (Vitest)
        working-directory: frontend
        run: npm test

      - name: Run TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build

      - name: Run NPM Dependency Vulnerability Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-trivy-scan:
    name: Docker Multi-Stage Build & Trivy Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-quality-and-security, frontend-quality-and-security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single-container Docker image
        run: docker build -f docker/Dockerfile -t gateway-front-end:ci .

      - name: Run Trivy vulnerability scanner on container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "gateway-front-end:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

